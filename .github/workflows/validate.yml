name: Validate kits

# Builds every kit with the v3 sandbox-kit BuildKit frontend. Each
# descriptor's first line, `# syntax=docker/sandbox-kit:3`, dispatches the
# frontend, which strictly decodes and validates the descriptor during the
# build. A successful build is the validation; `--output type=cacheonly`
# throws the result away.
#
# This replaces the v2 `verify-kit-spec` check from docker/sbx-kits-contrib,
# which only understands `spec.yaml` (schemaVersion 1/2). `sbx kit validate`
# is no use either: it doesn't accept v3 source kits.
#
# A kit is any top-level directory holding a descriptor named after itself
# (`<dir>/<dir>.yaml`), the same rule sbx-kits-contrib's discover-kits.sh uses.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build every kit
        run: |
          set -euo pipefail
          status=0
          found=0
          for f in */*.yaml; do
            kit=$(dirname "$f")
            [ "$f" = "${kit}/${kit}.yaml" ] || continue
            found=1
            echo "::group::build ${kit}"
            if ! (cd "$kit" && docker buildx build . -f "${kit}.yaml" --output type=cacheonly); then
              echo "::error file=${f}::${kit} failed to build"
              status=1
            fi
            echo "::endgroup::"
          done
          [ "$found" = 1 ] || { echo "::error::no kits found"; exit 1; }
          exit "$status"
