schemaVersion: "2"
kind: mixin
name: gitlab
displayName: GitLab (glab + token auth)
description: >
  Installs the glab CLI and wires up token-based auth for gitlab.com so the
  agent can push branches (over the SSH agent, forwarded automatically) and
  open merge requests (over the API, via this kit's credential wiring).

# --- Network -----------------------------------------------------------
# v2 capabilities block: the egress allowlist. If you're on self-hosted
# GitLab, replace gitlab.com everywhere in this file with your hostname.
caps:
  network:
    allow:
      - gitlab.com

# --- Credentials ---------------------------------------------------------
# v2 credentials are a flat list, one entry per service, combining what
# used to be three separate v1 blocks (credentials.sources, network.
# serviceDomains, network.serviceAuth) into one apiKey sub-block.
#
# Note there's no env/file source declared here - in v2 the kit only
# describes WHAT it needs (service id + where to inject it). WHERE the
# real value lives is entirely up to the user-side bindings file
# (~/.config/sbx/credentials.yaml), populated by `sbx secret set-custom`.
credentials:
  - service: gitlab
    description: GitLab personal/project access token (api scope)
    apiKey:
      name: GITLAB_TOKEN
      proxyManaged: true
      inject:
        - domain: gitlab.com
          header: PRIVATE-TOKEN
          format: "%s"

# --- Install ---------------------------------------------------------
commands:
  install:
    - command: |
        curl -s "https://gitlab.com/gitlab-org/cli/-/raw/main/scripts/install.sh" | sh
      description: Install glab CLI (official install script - always gets current release)
    - command: "glab config set -g host gitlab.com"
      user: "1000"
      description: Point glab at gitlab.com by default
